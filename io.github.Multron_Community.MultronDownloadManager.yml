app-id: io.github.Multron_Community.MultronDownloadManager
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: multron-download-manager

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: multron-download-manager
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm755 multron-download-manager.sh /app/bin/multron-download-manager
      - install -Dm644 io.github.Multron_Community.MultronDownloadManager.desktop /app/share/applications/io.github.Multron_Community.MultronDownloadManager.desktop
      - install -Dm644 io.github.Multron_Community.MultronDownloadManager.metainfo.xml /app/share/metainfo/io.github.Multron_Community.MultronDownloadManager.metainfo.xml
      - install -Dm644 io.github.Multron_Community.MultronDownloadManager.png /app/share/icons/hicolor/256x256/apps/io.github.Multron_Community.MultronDownloadManager.png
    sources:
      - type: extra-data
        filename: multron-download-manager.deb
        only-arches:
          - x86_64
        url: https://github.com/Multron-Community/Multron-Download-Manager/releases/download/v0.0.11/Multron.Download.Manager_0.0.11_amd64.deb
        sha256: aade85cab02f7dbd0b90017acd3fef6274c6ccb2a6622536b46b3160559b16a9
        size: 14051104

      - type: extra-data
        filename: multron-download-manager.deb
        only-arches:
          - aarch64
        url: https://github.com/Multron-Community/Multron-Download-Manager/releases/download/v0.0.11/Multron.Download.Manager_0.0.11_arm64.deb
        sha256: d70b9ebd6602cb1cf3242897f91cd0f98b06584e88542c5b8f845fbec0a41198
        size: 13498060

      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -xf multron-download-manager.deb
          - bsdtar -xf data.tar.*
          - rm -f multron-download-manager.deb debian-binary control.tar.* data.tar.*

      - type: script
        dest-filename: multron-download-manager.sh
        commands:
          - exec /app/extra/usr/bin/multron-download-manager "$@"

      - type: file
        path: io.github.Multron_Community.MultronDownloadManager.desktop

      - type: file
        path: io.github.Multron_Community.MultronDownloadManager.metainfo.xml

      - type: file
        path: io.github.Multron_Community.MultronDownloadManager.png

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    cleanup:
    - /include
    - /lib/pkgconfig
    config-opts:
    - -DENABLE_BINDINGS_MONO=NO
    - -DENABLE_BINDINGS_VALA=NO
    - -DENABLE_GTKDOC=NO
    modules:
    - name: intltool
      cleanup:
      - '*'
      sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        mirror-urls:
        - https://sources.suse.com/SUSE:SLE-15-SP7:Update:BCI/000product/ca527df4d03bf96a67854a8ed2f0c64b/INCLUDED/SUSE:SLE-15-SP6:GA::intltool::45f77273c3f2ef792fa697b444183beb/intltool-0.51.0.tar.gz
        - https://mirror-hk.koddos.net/lfs/lfs-packages/12.0/intltool-0.51.0.tar.gz
        - https://gstreamer.freedesktop.org/src/mirror/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: patch
        path: intltool-perl5.26-regex-fixes.patch
    - name: libdbusmenu
      buildsystem: autotools
      build-options:
        cflags: -Wno-error
      cleanup:
      - '*.la'
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share/doc
      - /share/gtk-doc
      config-opts:
      - --with-gtk=3
      - --disable-dumper
      - --disable-static
      - --disable-tests
      - --disable-gtk-doc
      - --enable-introspection=no
      - --disable-vala
      sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        mirror-urls:
        - https://sources.suse.com/SUSE:SLFO:Main:Build/libdbusmenu/a5b3e4717f09f90f9cd5568a5f933e8d/libdbusmenu-16.04.0.tar.gz
        - https://mirror.math.princeton.edu/pub/frugalware/frugalware-2.1/source/xlib/libdbusmenu/libdbusmenu-16.04.0.tar.gz
        - https://ftp.fr.openbsd.org/pub/OpenBSD/distfiles/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
      - type: patch
        paths:
        - 0001-Fix-HAVE_VALGRIND-AM_CONDITIONAL.patch
    - name: ayatana-ido
      buildsystem: cmake-ninja
      cleanup:
      - /include
      - /lib/pkgconfig
      config-opts:
      - -DENABLE_INTROSPECTION=OFF
      sources:
      - type: git
        url: https://github.com/AyatanaIndicators/ayatana-ido.git
        tag: 0.10.4
        commit: f968079b09e2310fefc3fc307359025f1c74b3eb
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
      - type: patch
        paths:
        - 0001-Make-introspection-configurable.patch
    - name: libayatana-indicator
      buildsystem: cmake-ninja
      cleanup:
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share
      sources:
      - type: git
        url: https://github.com/AyatanaIndicators/libayatana-indicator.git
        tag: 0.9.5
        commit: 0db7877be8c61953b50540183d5932ab159181f1
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
    sources:
    - type: git
      url: https://github.com/AyatanaIndicators/libayatana-appindicator.git
      tag: 0.6.1
      commit: 836356daa20c833cbc051c77c6b4f97c94de5e61
      x-checker-data:
        type: git
        tag-pattern: ^([\d.]+)$
